<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BullGym</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f5f3;--card:#fff;--tx:#161616;--mu:#666;--rd:#d8201f;--bd:#e3e0db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--card:#1d1d1d;--tx:#f2f2f2;--mu:#a0a0a0;--bd:#333}}
:root[data-theme=dark]{--bg:#121212;--card:#1d1d1d;--tx:#f2f2f2;--mu:#a0a0a0;--bd:#333}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Arial,Helvetica,sans-serif}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#111;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav img{height:42px;background:#fff;border-radius:6px;padding:2px 6px;margin-right:auto}
nav button{background:none;border:0;color:#ddd;padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--rd);color:#fff}
main{max-width:1100px;margin:auto;padding:18px 16px 60px}
h1,h2,h3{margin:.2em 0 .5em}.hero{background:#111;color:#fff;border-radius:14px;padding:34px 24px;text-align:center}
.hero h1{font-size:2.2em}.hero p{color:#ccc}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:16px 0}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;overflow-x:auto}
.big{font-size:2em;font-weight:700;color:var(--rd)}.mu{color:var(--mu);font-size:.9em}
button.p,.btn{background:var(--rd);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit}
button.s{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0 10px}
label{font-size:.85em;color:var(--mu)}table{border-collapse:collapse;width:100%;font-size:.88em}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.sub button.on{background:var(--rd);color:#fff;border-color:var(--rd)}
.bar{height:8px;background:var(--rd);border-radius:4px}.q{margin-bottom:14px}.q label{color:var(--tx);font-size:1em;display:block}
.q .o{display:block;font-size:.95em;color:var(--tx);padding:2px 0}.q .o input{width:auto;margin:0 6px 0 0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--bd);font-size:.8em}.ok{color:#17803d}.hidden{display:none}
</style></head><body>

excel(){return `<div class=c><p>Descarga todo en Excel (Clientes, Bajas, Asesorías, Promociones, Encuesta, Configuración).</p><button class=p onclick=xl()>Descargar Excel</button> <span id=xm class=mu></span></div>`}};
function ctab(){const q=$('#cq').value.toLowerCase(),f=$('#cs').value;const r=S.cl.filter(x=>x[1].toLowerCase().includes(q)&&(!f||x[4]==f||x[3]==f));
$('#ct').innerHTML=`<p class=mu>${r.length} clientes (se muestran 100)</p><table><tr><th>#<th>Nombre<th>Teléfono<th>Tipo<th>Alta<th>Estado</tr>${r.slice(0,100).map(x=>`<tr><td>${x[0]}<td>${esc(x[1])}<td>${esc(x[2])}<td>${x[3]=='V'?'Veterano':'Nuevo'}<td>${x[5]}<td><select style="margin:0" onchange="st(${x[0]},this.value,1)">${['A','B','R'].map((k,i)=>`<option value=${k} ${x[4]==k?'selected':''}>${E[i]}`).join('')}</select></tr>`).join('')}</table>`}
function st(id,v,k){const x=S.cl.find(c=>c[0]==id);x[4]=v;save();if(!k)show('admin')}
function addA(){const n=$('#an').value.trim();if(!n)return;S.as.push([n,$('#am').value,new Date().toISOString().slice(0,10),'Activa',$('#ao').value]);save();show('admin')}
function cfg(){Object.assign(S.cfg,{insc:+$('#p1').value,mens:+$('#p2').value,email:$('#p3').value,hook:$('#p4').value,pin:$('#p5').value});save();$('#pk').textContent='✔ Guardado'}
async function xl(){const w=XLSX.utils.book_new(),add=(n,h,r)=>XLSX.utils.book_append_sheet(w,XLSX.utils.aoa_to_sheet([h,...r]),n);
const L=['Activo','Baja','Regresó'],T=x=>x=='V'?'Veterano':'Nuevo';
add('Clientes',['ID','Nombre','Teléfono','Tipo','Estado','Fecha alta','Motivo de baja'],S.cl.map(x=>[x[0],x[1],x[2],T(x[3]),L[['A','B','R'].indexOf(x[4])],x[5],MOT[x[6]]||'']));
add('Asesorías',['Cliente','Modalidad','Fecha','Estado','Notas'],S.as);
add('Promociones',['Título','Descripción','Vigencia','Activa'],S.promos.map(p=>[p.t,p.d,p.v,p.on?'Sí':'No']));
add('Encuesta',['Cliente',...Q.map((q,i)=>(i+1)+'. '+q.t)],S.rs.map(r=>[r[0],...r[1].map((a,i)=>Q[i].o[a])]));
add('Configuración',['Concepto','Valor'],[['Inscripción',S.cfg.insc],['Mensualidad',S.cfg.mens],['Correo',S.cfg.email]]);
const d=await claude.use('downloads');if(!d){$('#xm').textContent='Descarga no disponible aquí; usa el archivo Excel entregado en el chat.';return}
try{await d.save({filename:'BullGym_base_de_datos.xlsx',data:new Blob([XLSX.write(w,{bookType:'xlsx',type:'array'})])})}catch(e){}}
show('inicio');
</script></body></html>
